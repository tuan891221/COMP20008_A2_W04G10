name: Profile Melbourne A2 data

on:
  push:
    branches: [main]
    paths:
      - "scripts/profile_melbourne.py"
      - "src/**"
      - ".github/workflows/profile-data.yml"
  workflow_dispatch:

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download official Melbourne data and profile
        run: python scripts/profile_melbourne.py
      - name: Upload profile
        uses: actions/upload-artifact@v4
        with:
          name: melbourne-data-profile
          path: output/data_profile.json
