name: Execute full A2 analysis

on:
  push:
    branches: [main]
    paths:
      - "notebooks/**"
      - "src/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/execute-all.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbconvert ipykernel

      - name: Download original Melbourne Inside Airbnb data
        run: |
          python scripts/download_melbourne_data.py
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("data/listings.csv", low_memory=False)
          print("Official raw shape:", df.shape)
          print("Median coordinates:", df["latitude"].median(), df["longitude"].median())
          PY

      - name: Execute preprocessing
        run: |
          jupyter nbconvert --to notebook --execute notebooks/01_preprocessing.ipynb             --output 01_preprocessing.executed.ipynb --output-dir output             --ExecutePreprocessor.timeout=900

      - name: Execute correlation
        run: |
          jupyter nbconvert --to notebook --execute notebooks/02_correlation.ipynb             --output 02_correlation.executed.ipynb --output-dir output             --ExecutePreprocessor.timeout=900

      - name: Execute modelling
        run: |
          jupyter nbconvert --to notebook --execute notebooks/03_modelling.ipynb             --output 03_modelling.executed.ipynb --output-dir output             --ExecutePreprocessor.timeout=1800

      - name: Execute feature selection
        run: |
          jupyter nbconvert --to notebook --execute notebooks/04_feature_selection.ipynb             --output 04_feature_selection.executed.ipynb --output-dir output             --ExecutePreprocessor.timeout=900

      - name: Replace source notebooks with executed notebooks
        run: |
          cp output/01_preprocessing.executed.ipynb notebooks/01_preprocessing.ipynb
          cp output/02_correlation.executed.ipynb notebooks/02_correlation.ipynb
          cp output/03_modelling.executed.ipynb notebooks/03_modelling.ipynb
          cp output/04_feature_selection.executed.ipynb notebooks/04_feature_selection.ipynb

      - name: List outputs
        run: |
          find output -maxdepth 2 -type f -print | sort
          find data -maxdepth 1 -type f -print | sort

      - name: Commit executed notebooks and generated result files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/ output/tables/ output/figures/ data/SOURCE_METADATA.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Commit executed notebooks and analysis outputs [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload complete analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2-full-analysis
          path: |
            output/
            data/processed_listings.csv
            data/split_assignments.csv
            data/SOURCE_METADATA.json
          retention-days: 14
