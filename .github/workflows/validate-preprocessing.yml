name: Validate preprocessing notebook

on:
  push:
    branches: [main]
    paths:
      - "notebooks/01_preprocessing.ipynb"
      - "src/**"
      - "scripts/download_melbourne_data.py"
      - "requirements.txt"
      - ".github/workflows/validate-preprocessing.yml"
  workflow_dispatch:

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbconvert ipykernel

      - name: Download original Melbourne Inside Airbnb data
        run: |
          python scripts/download_melbourne_data.py
          ls -lh data/listings.csv
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("data/listings.csv", low_memory=False)
          print("Shape:", df.shape)
          print("Columns:", len(df.columns))
          print("room_type values:", df["room_type"].value_counts(dropna=False).head().to_dict())
          PY

      - name: Execute preprocessing notebook
        run: |
          jupyter nbconvert             --to notebook             --execute notebooks/01_preprocessing.ipynb             --output 01_preprocessing.executed.ipynb             --output-dir output             --ExecutePreprocessor.timeout=900

      - name: Upload executed notebook and source metadata
        uses: actions/upload-artifact@v4
        with:
          name: preprocessing-validation
          path: |
            output/01_preprocessing.executed.ipynb
            data/SOURCE_METADATA.json
          retention-days: 14
